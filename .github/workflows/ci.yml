name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Candidate archive checks
        run: python tools/check-candidate-archive_test.py
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Offline pilot report
        id: pilot
        run: go run ./tools/offline-pilot --race --export-binaries "${{ runner.temp }}/tested-candidate" > "${{ runner.temp }}/offline-pilot.json"
      - name: Upload offline pilot report
        if: ${{ !cancelled() && steps.pilot.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-pilot-linux
          path: ${{ runner.temp }}/offline-pilot.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload tested candidate
        if: ${{ !cancelled() && steps.pilot.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-candidate-linux
          path: ${{ runner.temp }}/tested-candidate/*
          if-no-files-found: error
          retention-days: 14
      - name: Benchmark smoke
        run: go test -run '^$' -bench '^(BenchmarkNativeClient|BenchmarkRetainedCapacity|BenchmarkFlatContent|BenchmarkContentHashOrdering|BenchmarkEnvelopeHash)$' -benchtime=1x ./internal/conformance
      - name: Independent corpus checks
        run: |
          python3 tools/gen-node-momentum-vectors/check.py
          python3 tools/gen-node-momentum-vectors/check-account-amounts.py internal/testdata/conformance/account-amounts.json
          python3 tools/gen-node-momentum-vectors/check-account-segments.py internal/testdata/conformance/account-segments.json
          python3 tools/gen-node-momentum-vectors/check-contract-batches.py internal/testdata/conformance/contract-batches.json
          python3 tools/gen-node-momentum-vectors/check-delayed-inclusion.py internal/testdata/conformance/delayed-inclusion.json
          python3 tools/gen-node-momentum-vectors/check-content-scaling.py
          python3 tools/gen-node-momentum-vectors/check-genesis.py
          python3 tools/gen-node-momentum-vectors/check-genesis_test.py
          python3 tools/gen-node-momentum-vectors/check_bytes_test.py
          python3 tools/check-verification-context.py
      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.6.2

  native-platform:
    name: Native platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Candidate archive checks
        run: python tools/check-candidate-archive_test.py
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Native test
        run: go test -count=1 -timeout=5m ./...
      - name: Offline pilot report
        id: pilot
        shell: bash
        run: go run ./tools/offline-pilot --export-binaries "${{ runner.temp }}/tested-candidate" > "${{ runner.temp }}/offline-pilot.json"
      - name: Upload offline pilot report
        if: ${{ !cancelled() && steps.pilot.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-pilot-${{ matrix.os }}
          path: ${{ runner.temp }}/offline-pilot.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload tested candidate
        if: ${{ !cancelled() && steps.pilot.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-candidate-${{ matrix.os }}
          path: ${{ runner.temp }}/tested-candidate/*
          if-no-files-found: error
          retention-days: 14
      - name: Benchmark smoke
        run: go test -run '^$' -bench '^(BenchmarkNativeClient|BenchmarkRetainedCapacity|BenchmarkFlatContent|BenchmarkContentHashOrdering|BenchmarkEnvelopeHash)$' -benchtime=1x ./internal/conformance
