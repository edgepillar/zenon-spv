      - name: Public Chain foreign startup recorded controls
        run: python -I -B tools/gen-state-root-vectors/check_public_chain_foreign_startup_test.py -v
      - name: Independent recorded public Chain foreign startup
        run: python -I -B tools/gen-state-root-vectors/check_public_chain_foreign_startup.py --source-revision "${{ github.sha }}"
      - name: Cache identifier rollback source controls
