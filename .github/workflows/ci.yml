      - name: Cache identifier rollback recorded controls
        run: python -I -B tools/gen-state-root-vectors/check_cache_identifier_rollback_test.py -v
      - name: Independent recorded cache identifier rollback
        run: python -I -B tools/gen-state-root-vectors/check_cache_identifier_rollback.py --source-revision "${{ github.sha }}"
