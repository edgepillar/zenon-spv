name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Offline pilot report
        id: pilot
        run: go run ./tools/offline-pilot --race > "${{ runner.temp }}/offline-pilot.json"
      - name: Upload offline pilot report
        if: ${{ !cancelled() && steps.pilot.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-pilot-linux
          path: ${{ runner.temp }}/offline-pilot.json
          if-no-files-found: error
          retention-days: 14
      - name: Benchmark smoke
        run: go test -run '^$' -bench '^BenchmarkNativeClient$' -benchtime=1x ./internal/conformance
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.2

  native-platform:
    name: Native platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Native test
        run: go test -count=1 -timeout=5m ./...
      - name: Offline pilot report
        id: pilot
        shell: bash
        run: go run ./tools/offline-pilot > "${{ runner.temp }}/offline-pilot.json"
      - name: Upload offline pilot report
        if: ${{ !cancelled() && steps.pilot.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-pilot-${{ matrix.os }}
          path: ${{ runner.temp }}/offline-pilot.json
          if-no-files-found: error
          retention-days: 14
      - name: Benchmark smoke
        run: go test -run '^$' -bench '^BenchmarkNativeClient$' -benchtime=1x ./internal/conformance
