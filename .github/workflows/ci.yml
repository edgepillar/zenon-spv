        run: python -I -B tools/gen-node-static-vectors/check.py --openssl openssl --source-revision "${{ github.sha }}" > "${{ runner.temp }}/node-static-signatures.json"
      - name: Node static runtime boundaries
        run: go test -v -count=1 -run '^TestNodeStatic' ./internal/conformance
      - name: Node account basic store corpus controls
        run: python -I -B tools/gen-node-account-basic-vectors/check_test.py -v
      - name: Independent node account basic store checks
        shell: bash
        run: python -I -B tools/gen-node-account-basic-vectors/check.py --source-revision "${{ github.sha }}"
      - name: Node account basic runtime boundaries
        run: go test -v -count=1 -run '^TestNodeAccountBasic(Runtime|Match)' ./internal/conformance
      - name: Node account basic RPC boundaries
        run: go test -v -count=1 -run '^TestNodeAccountBasicRPC' ./internal/conformance
      - name: Recorded account basic observer boundaries
        run: go test -v -count=1 -run '^TestCompiledNodeAccountBasicObserver$' ./internal/conformance
      - name: Node account PoW corpus controls
        run: python -I -B tools/gen-node-account-basic-vectors/check_pow_test.py -v
      - name: Independent node account PoW checks
        run: python -I -B tools/gen-node-account-basic-vectors/check_pow.py --source-revision "${{ github.sha }}"
      - name: Recorded account PoW runtime and RPC boundaries
        run: go test -v -count=1 -run '^TestNodeAccountPoW' ./internal/conformance
      - name: Recorded account PoW observer boundaries
        run: go test -v -count=1 -run '^TestCompiledNodeAccountPoWObserver$' ./internal/conformance
      - name: Node receive store corpus controls
        run: python -I -B tools/gen-node-account-basic-vectors/check_receive_test.py -v
      - name: Independent node receive store checks
        run: python -I -B tools/gen-node-account-basic-vectors/check_receive.py --source-revision "${{ github.sha }}"
      - name: Node receive inclusion and protocol boundaries
        run: go test -v -count=1 -run '^TestNodeAccountReceive(Runtime|Match)' ./internal/conformance
      - name: Node receive RPC boundaries
        run: go test -v -count=1 -run '^TestNodeAccountReceiveRPC' ./internal/conformance
      - name: Recorded receive observer boundaries
        run: go test -v -count=1 -run '^TestCompiledNodeAccountReceiveObserver$' ./internal/conformance
      - name: Node account context corpus controls
        run: python -I -B tools/gen-node-account-context-vectors/check_test.py -v
      - name: Independent node account context checks
        shell: bash
        run: python -I -B tools/gen-node-account-context-vectors/check.py --source-revision "${{ github.sha }}"
      - name: Node account transaction corpus controls
        run: python -I -B tools/gen-node-account-vectors/check_test.py -v
      - name: Independent node account transaction checks
        shell: bash
        run: |
          signature_backend=openssl
          if [ "$RUNNER_OS" = macOS ]; then
            signature_backend="$(brew --prefix openssl@3)/bin/openssl"
          fi
          python -I -B tools/gen-node-account-vectors/check.py --openssl "$signature_backend" --source-revision "${{ github.sha }}" > "${{ runner.temp }}/node-account-signatures.json"
      - name: Node account transaction runtime boundaries
        run: go test -v -count=1 -run '^TestNodeAccountTransaction' ./internal/conformance
      - name: Upload independent signature report
        if: ${{ !cancelled() && steps.signatures.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-signatures-linux
          path: |
            ${{ runner.temp }}/node-signatures.json
            ${{ runner.temp }}/node-static-signatures.json
            ${{ runner.temp }}/node-account-signatures.json
          if-no-files-found: error
          retention-days: 14
      - name: Build
        run: go build ./...
      - name: Independent consumer decisions
        shell: bash
        run: |
          consumer_binary="${{ runner.temp }}/consumer-reference$(go env GOEXE)"
          GOTOOLCHAIN=local GOWORK=off GOFLAGS= GOENV=off GOPROXY=off GOSUMDB=off go build -trimpath -o "$consumer_binary" ./tools/consume-query-report
          python -I -B tools/check-query-consumer.py --consumer "$consumer_binary" --source-revision "${{ github.sha }}"
      - name: Vet
        run: go vet ./...
      - name: Test
        # Isolate full-package orchestration. Selected resource workload
        # concurrency, rounds and observer completion bounds remain unchanged.
        run: go test -p 1 -race -count=1 -coverprofile=coverage.out ./...
      - name: Verify root module cache
        id: root_module_cache
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOENV: 'off'
          GOFLAGS: ''
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Offline pilot report
        id: pilot
        run: go run ./tools/offline-pilot --race --export-binaries "${{ runner.temp }}/tested-candidate" > "${{ runner.temp }}/offline-pilot.json"
      - name: Verify exported candidate
        id: candidate
        shell: bash
        run: python -I -B tools/check-exported-candidate.py --require-skip-ledger --directory "${{ runner.temp }}/tested-candidate" --expect-revision "${{ github.sha }}" --expect-os "$(go env GOOS)" --expect-architecture "$(go env GOARCH)"
      - name: Source-selected scenario inventory
        id: scenario_inventory
        shell: bash
        run: |
          candidate_directory="${{ runner.temp }}/tested-candidate"
          report_sha256="$(python -I -B -c 'import json,sys; source=open(sys.argv[1],"rb"); raw=source.read(262145); source.close(); assert 0<len(raw)<=262144; print(json.loads(raw)["report"]["sha256"])' "$candidate_directory/manifest.json")"
          python -I -B tools/check-scenario-inventory.py --source . --report "$candidate_directory/offline-pilot.json" --expect-report-sha256 "$report_sha256" --expect-revision "${{ github.sha }}" --expect-os "$(go env GOOS)" --expect-architecture "$(go env GOARCH)" --require-skip-ledger
      - name: Independent node consumer workflow
        shell: bash
        run: |
          candidate_directory="${{ runner.temp }}/tested-candidate"
          executable_suffix="$(go env GOEXE)"
          python -I -B tools/check-node-query-consumer.py --verifier "$candidate_directory/zenon-spv$executable_suffix" --consumer "$candidate_directory/consume-query-report$executable_suffix" --source-revision "${{ github.sha }}"
      - name: Independent compiled context pin options
        shell: bash
        run: |
          candidate_directory="${{ runner.temp }}/tested-candidate"
          executable_suffix="$(go env GOEXE)"
          python -I -B tools/check-context-pin-options.py --verifier "$candidate_directory/zenon-spv$executable_suffix" --source-revision "${{ github.sha }}"
      - name: Actual observer diagnostic consumption
        shell: bash
        run: |
          candidate_directory="${{ runner.temp }}/tested-candidate"
          executable_suffix="$(go env GOEXE)"
          python -I -B tools/check-observer-report-consumer.py --observer "$candidate_directory/observe-block$executable_suffix" --verifier "$candidate_directory/zenon-spv$executable_suffix" --consumer "$candidate_directory/consume-query-report$executable_suffix" --collector "$candidate_directory/fetch-bundle$executable_suffix" --source-revision "${{ github.sha }}"
      - name: Upload offline pilot report
        if: ${{ !cancelled() && steps.pilot.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-pilot-linux
          path: ${{ runner.temp }}/offline-pilot.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload tested candidate
        if: ${{ !cancelled() && steps.pilot.outcome == 'success' && steps.candidate.outcome == 'success' && steps.scenario_inventory.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-candidate-linux
          path: ${{ runner.temp }}/tested-candidate/*
          if-no-files-found: error
          retention-days: 14
      - name: RPC envelope allocation observations
        run: go test -run '^$' -bench '^BenchmarkRPCEnvelopeExtensions$' -benchtime=3x -benchmem ./internal/fetch
      - name: RPC error-data allocation observations
        run: go test -run '^$' -bench '^BenchmarkRPCErrorData$' -benchtime=3x -benchmem ./internal/fetch
      - name: Proof account amount allocation observations
        run: go test -run '^$' -bench '^BenchmarkProofAccountAmountDecode$' -benchtime=3x -benchmem ./internal/proof
      - name: Proof bundle extension allocation observations
        run: go test -run '^$' -bench '^BenchmarkProofBundleExtensions$' -benchtime=3x -benchmem ./internal/proof
      - name: Proof bundle field allocation observations
        run: go test -run '^$' -bench '^BenchmarkProofBundleFieldSpans$' -benchtime=1x -count=3 -benchmem ./internal/proof
      - name: Collector staging allocation observations
        run: go test -run '^$' -bench '^BenchmarkCollectorStaging$' -benchtime=1x -count=3 -benchmem ./tools/observe-block
      - name: Observer expectations input-read allocation observations
        run: go test -run '^$' -bench '^BenchmarkObserverExpectationsRead$' -benchtime=100x -benchmem -cpu=1 -count=3 ./tools/observe-block
      - name: Observer query staging allocation observations
        run: go test -run '^$' -bench '^BenchmarkObserverQueryStaging$' -benchtime=1x -benchmem -cpu=1 -count=3 ./tools/observe-block
      - name: RPC data-hash allocation observations
        run: go test -run '^$' -bench '^BenchmarkRPCDataHashDecode$' -benchtime=3x -benchmem ./internal/fetch
      - name: Address-byte checker controls
        run: python -I -B tools/check-address-checksum-vectors_test.py
      - name: Independent address bytes
        run: python -I -B tools/check-address-checksum-vectors.py
      - name: Address checksum allocation observations
        run: go test -run '^$' -bench '^BenchmarkRPCAddressChecksum$' -benchtime=3x -benchmem ./internal/fetch
      - name: RPC response-read allocation observations
        run: go test -run '^$' -bench '^BenchmarkRPCResponseRead$' -benchtime=3x -benchmem ./internal/fetch
      - name: Optional RPC Base64 allocation observations
        run: go test -run '^$' -bench '^BenchmarkRPCOptionalBase64$' -benchtime=3x -benchmem ./internal/fetch
      - name: Consumer input-read allocation observations
        shell: bash
        run: go test -run '^$' -bench '^BenchmarkConsumerInputRead$' -benchtime=100x -benchmem -cpu=1 -count=3 ./tools/consume-query-report
      - name: Independent consumer context hash bytes
        run: python -I -B tools/check-consumer-context-hashes.py
      - name: Consumer context hash controls
        shell: bash
        run: go test -v -count=1 -run '^TestConsumerContextFingerprintVectors$' ./tools/consume-query-report
      - name: Consumer context hash allocation observations
        shell: bash
        run: go test -run '^$' -bench '^BenchmarkConsumerContextFingerprint$' -benchtime=1000x -benchmem -cpu=1 -count=3 ./tools/consume-query-report
      - name: Consumer oversized-token allocation observations
        shell: bash
        run: go test -run '^$' -bench '^BenchmarkConsumerTokenPrefilter$' -benchtime=20x -benchmem -cpu=1 -count=3 ./tools/consume-query-report
      - name: Consumer shape allocation observations
        shell: bash
        run: go test -run '^$' -bench '^BenchmarkConsumerShapeSpans$' -benchtime=10x -benchmem -cpu=1 -count=3 ./tools/consume-query-report
      - name: Shared immutable query observations
        shell: bash
        run: go test -run '^$' -bench '^BenchmarkSharedImmutableQueries$' -benchtime=1000x -benchmem -cpu=1,4 -count=3 ./internal/conformance
      - name: Account amount hash allocation observations
        run: go test -run '^$' -bench '^BenchmarkAccountAmountHash$' -benchtime=1000x -benchmem -cpu=1 -count=3 ./internal/conformance
      - name: Benchmark smoke
        run: go test -run '^$' -bench '^(BenchmarkNativeClient|BenchmarkRetainedCapacity|BenchmarkFlatContent|BenchmarkContentHashOrdering|BenchmarkEnvelopeHash)$' -benchtime=1x ./internal/conformance
      - name: Independent corpus checks
        run: |
          python3 tools/gen-node-momentum-vectors/check.py
          python3 tools/gen-node-momentum-vectors/check-account-amounts.py internal/testdata/conformance/account-amounts.json
          python3 tools/gen-node-momentum-vectors/check-account-segments.py internal/testdata/conformance/account-segments.json
          python3 tools/gen-node-momentum-vectors/check-contract-batches.py internal/testdata/conformance/contract-batches.json
          python3 tools/gen-node-momentum-vectors/check-delayed-inclusion.py internal/testdata/conformance/delayed-inclusion.json
          python3 tools/gen-node-momentum-vectors/check-content-scaling.py
          python3 tools/gen-node-momentum-vectors/check-genesis.py
          python3 tools/gen-node-momentum-vectors/check-genesis_test.py
          python3 tools/gen-node-momentum-vectors/check_bytes_test.py
          python3 tools/check-verification-context.py
      - name: Pinned lint schema bytes
        run: python -I -B -c "import hashlib; from pathlib import Path; assert hashlib.sha256(Path('.github/schemas/golangci.v2.6.2.jsonschema.json').read_bytes()).hexdigest() == 'fb4e21238eb335951ed287f36dd46edb56f741fbef22a27c6d89bd697fa7468f'"
      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.6.2
          # Validate the unchanged configuration against the pinned schema below.
          verify: false
      - name: Verify pinned lint configuration
        run: golangci-lint config verify --schema .github/schemas/golangci.v2.6.2.jsonschema.json

  native-platform:
    name: Native platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Intel macOS needs more time for the complete independent oracle controls.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # Qualify native macOS on the explicit Intel image.
        os: [macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Native test
        # Fail before the longer evidence controls, keeping every package and
        # the complete 100,000-member repeated-wire grid. This finite package
        # watchdog is not a latency acceptance threshold; subprocess deadlines
        # and evidence budgets remain unchanged.
        run: go test -p 1 -count=1 -timeout=10m ./...
      - name: Candidate archive checks
        run: python tools/check-candidate-archive_test.py -v
      - name: Direct candidate validation controls
        run: python -I -B tools/check-direct-candidate_test.py -v
      - name: Exported candidate checker controls
        run: python -B tools/check-exported-candidate_test.py
      - name: Source scenario inventory controls
        run: python -I -B tools/check-scenario-inventory_test.py
      - name: Bounded ledger inventory controls
        run: python -I -B tools/ledger-inventory/inventory_test.py --source-revision "${{ github.sha }}"
      - name: Verification context checks
        run: python tools/check-verification-context_test.py
      - name: Context pin option controls
        run: python -I -B tools/check-context-pin-options_test.py -v
      - name: Candidate v3 header encoding controls
        run: go test -json -count=1 -run '^TestCandidateV3Header' ./internal/chain
      - name: Candidate sparse proof controls
        run: go test -json -count=1 -run '^TestCandidateSMT' ./internal/proof
      - name: Owned state persistence controls
        run: go test -json -count=1 -run '^TestVerifiedStateSave' ./internal/verify
      - name: Owned state persistence observations
        run: go test -json -run '^$' -bench '^BenchmarkOwnedStatePersistence/' -benchtime=1x -benchmem -cpu=1 -count=3 ./internal/verify
      - name: Retained model header equality controls
        run: go test -v -count=1 -run '^TestSequenceHeaderEqualityMatchesReflection$' ./internal/verify
      - name: Retained model header comparison observations
        run: go test -run '^$' -bench '^BenchmarkSequenceHeaderEquality$' -benchtime=20000x -benchmem -cpu=1 -count=3 ./internal/verify
      - name: Chain text hex controls
        run: go test -v -count=1 -run '^TestChainTextHexContract$' ./internal/chain
      - name: Chain text hex allocation observations
        run: go test -run '^$' -bench '^BenchmarkChainTextHex$' -benchtime=20000x -benchmem -cpu=1 -count=3 ./internal/chain
      - name: Proof bundle row ownership controls
        run: go test -v -count=1 -run '^TestBundleRowOwnedSlots' ./internal/proof
      - name: Proof bundle row allocation observations
        run: go test -run '^$' -bench '^BenchmarkProofBundleRowOwnedSlots$' -benchtime=1x -benchmem -cpu=1 -count=3 ./internal/proof
      - name: Flat row capacity controls
        run: go test -v -count=1 -run '^TestFlatRowCapacity' ./internal/proof
      - name: Flat row capacity allocation observations
        run: go test -run '^$' -bench '^BenchmarkFlatRowCapacity$' -benchtime=1x -benchmem -cpu=1 -count=3 ./internal/proof
      - name: Fresh grouped CLI build controls
        run: go test -v -count=1 -run '^TestQueryCLIBuild' ./internal/conformance
      - name: Observer preflight input controls
        run: go test -v -count=1 -run '^TestObserverPreflight(Inputs|Replacements)$' ./tools/observe-block
      - name: Verifier unique selection controls
        run: go test -v -count=1 -run '^TestCompiledVerifierSelectionGuards$' ./internal/conformance
      - name: Verifier syntax privacy controls
        run: go test -v -count=1 -run '^TestCompiledVerifierSyntaxPrivacy$' ./internal/conformance
      - name: Collector syntax privacy controls
        run: go test -v -count=1 -run '^TestCompiledCollectorSyntaxPrivacy$' ./internal/conformance
      - name: Maintainer syntax privacy controls
        run: go test -v -count=1 -run '^TestCompiledMaintainerSyntaxPrivacy$' ./internal/conformance
      - name: Candidate executable descriptor controls
        run: go test -v -count=1 -run '^TestCandidate(ReadContract|FileReadBounds|NonregularOpenBoundaries|Manifest)$' ./tools/offline-pilot
      - name: Pilot skip ledger controls
        run: go test -v -count=1 -run '^TestOfflinePilotSkipLedger' ./tools/offline-pilot
      - name: Candidate binary export descriptor controls
        run: go test -v -count=1 -run '^TestCandidateBinary(ReadContract|FileReadBounds|NonregularOpenBoundaries|Export)$' ./internal/conformance
      - name: Pilot corpus capture controls
        run: go test -v -count=1 -run '^TestCorpus(MemberReadContract|PinnedHashes|StreamAndBounds)$' ./tools/offline-pilot
      - name: Pilot corpus allocation observations
        run: go test -run '^$' -bench '^BenchmarkCorpusHash$' -benchtime=10x -benchmem -cpu=1 -count=3 ./tools/offline-pilot
      - name: Compiled pilot corpus capture controls
        run: go test -v -count=1 -run '^TestCompiledPilotCorpusCapture$' ./tools/offline-pilot
      - name: Pilot source enumeration controls
        run: go test -v -count=1 -run '^TestSource(EnumerationBoundaries|EnumerationPreservesFingerprint|DirectoryPreflight)$' ./tools/offline-pilot
      - name: Compiled pilot source enumeration controls
        run: go test -v -count=1 -timeout 5m -run '^TestCompiledPilotSourceEnumeration$' ./tools/offline-pilot
      - name: Pilot source fingerprint controls
        run: go test -v -count=1 -run '^TestSource(ReadContract|FingerprintStreamAndBounds|InputPreflight|NonregularOpenBoundaries|ModuleAcceptsWindowsLineEndings|FingerprintBindsNamesBytesAndFixtures)$' ./tools/offline-pilot
      - name: Pilot source input allocation observations
        run: go test -run '^$' -bench '^BenchmarkSourceInputHash$' -benchtime=10x -benchmem -cpu=1 -count=3 ./tools/offline-pilot
      - name: Compiled pilot source preflight controls
        run: go test -v -count=1 -run '^TestCompiledPilotSourcePreflight$' ./tools/offline-pilot
      - name: Observer expectations input-read controls
        run: go test -v -count=1 -run '^TestObserverExpectationsReadContract$' ./tools/observe-block
      - name: Observer stream EOF controls
        run: go test -v -count=1 -run '^TestObservation(StreamEOF|EOFCompletionGate)$' ./tools/observe-block
      - name: Observer output completion controls
        run: |
          go test -v -count=1 -run '^TestObservationOutputCompletion$' ./tools/observe-block
          go test -v -count=1 -run '^TestObserverResourceFailureContext$' ./internal/conformance
      - name: Observer query staging controls
        run: go test -v -count=1 -run '^TestObserverQueryStagingContract$' ./tools/observe-block
      - name: Complete observer workflow resource observations
        run: go test -v -count=1 -timeout 10m -run '^TestCompiledBlockObserverResources$' ./internal/conformance
      - name: Private staging sampler controls
        run: python -I -B tools/test_private_staging.py
      - name: Observer diagnostic consumer controls
        run: |
