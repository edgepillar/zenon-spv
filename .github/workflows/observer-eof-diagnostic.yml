name: observer EOF diagnostic

on:
  push:
    branches: [codex/observer-eof-diagnostic]
    paths:
      - '.github/workflows/observer-eof-diagnostic.yml'
      - 'tools/diagnose-observer-eof/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.14'
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Sealed source selection
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') { throw 'Source selection changed' }
          if ((git status --porcelain).Length -gt 0) { throw 'Unselected source changes' }
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: One instrumented generation, no retries
        shell: pwsh
        run: |
          python -B tools/diagnose-observer-eof/run.py --source-root $env:GITHUB_WORKSPACE --scratch-parent $env:RUNNER_TEMP --go (Get-Command go).Source
          exit $LASTEXITCODE
